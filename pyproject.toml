[project]
name = "colony-tracking"
version = "0.1.0"
description = "Stable package for the colony-size measurement pipeline."
readme = "README.md"
authors = [
  { name = "Kai Riedmiller", email = "kai.riedmiller@iwr.uni-heidelberg.de" },
]
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy",
  "scipy",
  "scikit-image",
  "tifffile",
  "Pillow",
  "matplotlib",
  "micro-sam",
  "torch_em",
  "h5py",
  "tomli-w",
]

[project.scripts]
colony-tracking = "colony_tracking.cli:main"

[dependency-groups]
dev = [
  "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/colony_tracking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
  "integration: tests that require the real plate data and a GPU (excluded from the default run)",
]
